<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entdecke unsere Speisekarte. Handgemachte Manti, frische Beilagen und zentralasiatische Desserts.">
  <meta name="keywords" content="Speisekarte, Manti, Menü, Zentralasiatisch, Restaurant, Berlin, Vegetarisch">
  <title>Speisekarte | MANTI HAUS</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥟</text></svg>">
</head>
<body>

  <!-- ====== PAGE HERO ====== -->
  <header class="page-hero" style="padding: 6rem 0 3rem 0; min-height: auto;">
    <div class="container">
      <div class="section__label section__label--center reveal" data-i18n="menu.page.label">Unser Menü</div>
      <h1 class="page-hero__title reveal reveal-d1" data-i18n="menu.page.title" style="margin-bottom: 1rem;">SPEISEKARTE</h1>
      <p class="page-hero__subtitle reveal reveal-d2" data-i18n="menu.page.subtitle" style="margin-bottom: 0;">Handgemacht. Frisch gedämpft. Mit Liebe serviert.</p>
    </div>
  </header>

  <!-- ====== CATEGORY NAVIGATION ====== -->
  <div class="menu-nav-wrapper">
    <div class="container">
      <div class="menu-filters" id="category-filters" role="tablist">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- ====== MENU SECTION ====== -->
  <section class="section" style="padding-top: 2rem;">
    <div class="container">
      
      <!-- Search & Filters -->
      <div class="menu-controls reveal reveal-d1">
        
        <div class="menu-search">
          <svg class="menu-search__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="menu-search" class="menu-search__input" data-i18n-placeholder="menu.search.placeholder" placeholder="Gericht suchen..." aria-label="Speisekarte durchsuchen">
        </div>

        <label class="custom-toggle">
          <input type="checkbox" id="veg-toggle-input">
          <div class="custom-toggle__switch"></div>
          <span class="custom-toggle__label" data-i18n="menu.filter.veg">Nur vegetarische Gerichte</span>
        </label>

      </div>

      <!-- Menu Grid -->
      <div class="menu-grid" id="full-menu-grid" style="margin-top: 3rem;">
        <!-- Rendered by JS -->
      </div>
      
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/translations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNav('speisekarte');
      renderFooter();
      renderMobileBar();
      updateContent();

      const grid = document.getElementById('full-menu-grid');
      const filtersContainer = document.getElementById('category-filters');
      const searchInput = document.getElementById('menu-search');
      const vegToggle = document.getElementById('veg-toggle-input');
      
      let currentCategory = 'all';

      // 1. Render filter buttons
      MENU_CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `menu-filter ${cat.id === 'all' ? 'active' : ''}`;
        btn.dataset.id = cat.id;
        btn.setAttribute('role', 'tab');
        btn.innerHTML = `${cat.icon} ${tStr(cat.name)}`;
        
        btn.addEventListener('click', () => {
          document.querySelectorAll('.menu-filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = cat.id;
          renderMenu();
        });
        
        filtersContainer.appendChild(btn);
      });

      // 2. Render logic
      function renderMenu() {
        grid.innerHTML = '';
        let query = searchInput.value;
        let products = searchProducts(query);
        
        // Filter by category
        if (currentCategory !== 'all') {
          products = products.filter(p => p.category === currentCategory);
        }
        
        // Filter by vegetarian
        if (vegToggle.checked) {
          products = products.filter(p => p.vegetarian);
        }

        if (products.length === 0) {
          grid.innerHTML = `<div id="no-results" class="no-results" data-i18n="menu.empty">${translate('menu.empty') || 'Keine Gerichte gefunden. Bitte passe deine Filter an.'}</div>`;
          return;
        }

        // Animate entries slightly
        products.forEach((product, i) => {
          const cardHtml = renderProductCard(product);
          const temp = document.createElement('div');
          temp.innerHTML = cardHtml;
          const cardEl = temp.firstElementChild;
          
          if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
             cardEl.style.opacity = '0';
             cardEl.style.transform = 'translateY(20px)';
             setTimeout(() => {
                cardEl.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                cardEl.style.opacity = '1';
                cardEl.style.transform = 'translateY(0)';
             }, 50 * i);
          }
          grid.appendChild(cardEl);
        });
      }

      // 3. Bind events
      searchInput.addEventListener('input', renderMenu);
      vegToggle.addEventListener('change', renderMenu);
      
      // Click cards to open modal
      grid.addEventListener('click', e => {
        const card = e.target.closest('.card');
        const btn = e.target.closest('.card__btn');
        if (btn) return; // Cart button handled by onclick
        if (card) openProductModal(card.dataset.id);
      });

      // Initial render
      renderMenu();
      initRevealAnimations();
    });
  </script>
</body>
</html>
